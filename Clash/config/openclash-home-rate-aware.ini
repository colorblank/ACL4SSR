; -------------------- Rate-aware groups --------------------
; Low: 0.01x, 0.2x, 0.5x, 0.7x. The boundaries avoid matching 10.5x accidentally.
custom_proxy_group=♻️ 省流量`url-test`(^|[^0-9])(0\.01|0\.2|0\.5|0\.7)[xX]([^0-9]|$)`https://www.gstatic.com/generate_204`300,,80
; Normal: explicit 1x/1.0x plus the unmarked regional names used by Mojie.
; Positive matching is RE2-safe and naturally excludes quota/expiry/status entries.
custom_proxy_group=⚖️ 普通倍率`url-test`(日本|新加坡|香港|印度|台湾|美国|加拿大|德国|英国|(^|[^0-9])1(\.0)?[xX]([^0-9]|$))`https://www.gstatic.com/generate_204`300,,80
; High: any marked rate above 1x, including 1.5x, 2x and higher.
; Expensive nodes are never selected automatically for video/download.
custom_proxy_group=💎 高倍率测速`url-test`(^|[^0-9])(1\.0*[1-9][0-9]*|[2-9](\.[0-9]+)?|[1-9][0-9]+(\.[0-9]+)?)[xX]([^0-9]|$)`https://www.gstatic.com/generate_204`300,,100
; Automatic best-node selection covers Mojie's unmarked 1x regional nodes and explicit 1x.
custom_proxy_group=🚀 自动优选`url-test`(日本|新加坡|香港|印度|台湾|美国|加拿大|德国|英国|(^|[^0-9])1(\.0)?[xX]([^0-9]|$))`https://www.gstatic.com/generate_204`300,,80
custom_proxy_group=🐙 GitHub自动`url-test`(日本|新加坡|香港|印度|台湾|美国|加拿大|德国|英国|(^|[^0-9])1(\.0)?[xX]([^0-9]|$))`https://github.com/favicon.ico`300,,100
custom_proxy_group=📹 油管自动`url-test`(日本|新加坡|香港|印度|台湾|美国|加拿大|德国|英国|(^|[^0-9])1(\.0)?[xX]([^0-9]|$))`https://www.youtube.com/generate_204`300,,100
; Ordered failover for economical nodes; switches only when the current node fails.
custom_proxy_group=🛟 自动故障转移`fallback`(日本|新加坡|香港|印度|台湾|美国|加拿大|德国|英国|(^|[^0-9])1(\.0)?[xX]([^0-9]|$))`https://www.gstatic.com/generate_204`300

