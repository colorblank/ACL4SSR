name: Sync upstream ACL4SSR

on:
  schedule:
    # 02:17 Asia/Shanghai (18:17 UTC on the previous day).
    - cron: '17 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-master
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: master

      - name: Merge official upstream
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/ACL4SSR/ACL4SSR.git
          git fetch --prune upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo 'Fork already contains the latest upstream commit.'
            exit 0
          fi

          git merge --no-edit upstream/master
          git push origin HEAD:master

